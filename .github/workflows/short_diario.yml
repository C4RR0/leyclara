name: Short diario de test

# Tres preguntas tipo test al día en el canal de YouTube de LeyClara.
# Sin el secret YOUTUBE_TOKEN_LEYCLARA_JSON solo genera el vídeo (no sube nada).
# 3 al día desde el 16/10/2026. Desde el 18/10 lo dispara cron-job.org (job "Publicar Short
# LeyClara", 9:00, 15:00 y 19:00 hora de Madrid) porque el schedule de GitHub llegaba con horas
# de retraso; no volver a poner schedule aquí o se publicaría dos veces.
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo generar el vídeo, sin subirlo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: short-diario

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q edge-tts==7.2.8 pillow google-api-python-client google-auth
      - name: Token del canal
        env:
          TOKEN: ${{ secrets.YOUTUBE_TOKEN_LEYCLARA_JSON }}
        run: |
          if [ -n "$TOKEN" ]; then printf '%s' "$TOKEN" > shorts/token_leyclara.json; fi
      - name: Generar y publicar
        working-directory: shorts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prueba }}" = "true" ]; then
            python publicar_short.py --prueba
          else
            python publicar_short.py
          fi
      - name: Quiz del día en Telegram (con el Short de la tarde)
        # El schedule de quiz_telegram.yml llega con horas de retraso o no llega (el 19/10 no salió); el Short de
        # las 19:00 lo dispara cron-job.org puntual. quiz_telegram.py no publica dos el mismo día.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        continue-on-error: true
        working-directory: shorts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "$(TZ=Europe/Madrid date +%H)" -ge 18 ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then python quiz_telegram.py; fi
      - name: Dato del día en Telegram (con el Short de la mañana)
        # Idea de Teo votada por Sergio (21/10). dato_telegram.py no publica dos el mismo día.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        continue-on-error: true
        working-directory: shorts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "$(TZ=Europe/Madrid date +%H)" -lt 12 ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then python dato_telegram.py; fi
      - name: Encuesta de los viernes en Telegram (con el Short de la mañana)
        # Idea de Teo votada por Sergio (23/10). encuesta_viernes.py solo publica en viernes y una vez al día.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        continue-on-error: true
        working-directory: shorts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "$(TZ=Europe/Madrid date +%H)" -lt 12 ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then python encuesta_viernes.py; fi
      - name: Enlace del canal de Telegram en los Shorts antiguos
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        continue-on-error: true
        working-directory: shorts
        run: python enlace_canal_descripciones.py
      - name: Guardar vídeo de muestra
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: shorts/salidas/*.mp4
          retention-days: 3
      - name: Guardar estado de la cola
        run: |
          rm -f shorts/token_leyclara.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shorts/cola.json
          git add shorts/quiz_estado.json 2>/dev/null || true
          git add shorts/dato_estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Short publicado (cola de test)" && git pull --rebase -q && git push)
