name: Comprobar leyes en el BOE

# Cada lunes comprueba contra la API de datos abiertos del BOE si alguna ley de los packs ha cambiado
# y actualiza la página /actualizaciones/. Si una ley cambia, el run acaba en rojo (GitHub avisa por correo):
# hay que regenerar ese pack, subirlo a Gumroad y poner la nueva fecha en LEYES_BOE (actualizaciones.py).
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar y actualizar la página
        id: boe
        run: python actualizaciones.py
        continue-on-error: true
      - name: Publicar la página
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add actualizaciones/index.html
          git commit -m "Comprobación semanal del BOE $(date -u +%F)" || exit 0
          git pull --rebase && git push
      - name: Avisar si alguna ley ha cambiado
        if: steps.boe.outcome == 'failure'
        run: |
          echo "::error::Alguna ley de los packs ha cambiado en el BOE: revisar actualizaciones/index.html"
          exit 1
